<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Dashboard</title>
    <meta name="description" content="Wetter, Termine, VPS-Status und Nachrichten auf einen Blick." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070a10" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dashboard" />

    <!-- Der Splash steht im Dokument, nicht in Vue: er ist damit schon im
         ersten Frame da, waehrend Bundle und Schriften noch laden. Vue ersetzt
         beim Mount den Inhalt von #app und raeumt ihn damit selbst weg. -->
    <style>
      html { background: #070a10; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.25rem;
        background: radial-gradient(60ch 40ch at 50% 30%, #0d1421, #070a10 70%);
      }
      #boot img { width: 52px; height: 52px; opacity: 0.9; }
      #boot span {
        width: 120px;
        height: 2px;
        border-radius: 999px;
        background: #1b2431;
        overflow: hidden;
      }
      #boot span::after {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #2f7fe0, #4fe3d2);
        animation: boot 1.1s ease-in-out infinite;
      }
      @keyframes boot {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(240%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot span::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot">
        <img src="/favicon.svg" alt="" width="52" height="52" />
        <span></span>
      </div>
    </div>
    <noscript>
      <p style="color: #e9eef6; font-family: system-ui, sans-serif; padding: 2rem">
        Dieses Dashboard braucht JavaScript — es lebt von laufend nachgelieferten Werten.
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
