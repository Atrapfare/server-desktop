server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: dashboard
  http:
    client:
      # Bewusst unter dem 15-s-Timeout der Registry: so schlaegt die
      # HTTP-Schicht mit einer sprechenden Meldung fehl, statt abgewuergt zu werden.
      connect-timeout: 5s
      read-timeout: 10s

dashboard:
  weather:
    latitude: 48.7758
    longitude: 9.1829
    interval: 30m
  calendar:
    # Ohne gesetzte Variable meldet nur dieses Widget einen Fehler, statt den
    # Start der ganzen Anwendung zu verhindern.
    ical-url: ${CALENDAR_ICAL_URL:}
    interval: 15m
    look-ahead: 24h
  news:
    interval: 1h
    max-items: 15
    feeds:
      - name: Heise
        url: https://www.heise.de/rss/heise-atom.xml
      - name: Golem
        url: https://rss.golem.de/rss.php?feed=RSS2.0
      - name: Tagesschau
        url: https://www.tagesschau.de/index~rss2.xml
  vps:
    # Zeigt auf das lokale Ende des SSH-Tunnels, nicht auf den VPS selbst.
    url: ${VPS_STATS_URL:http://localhost:9100/stats}
    interval: 30s
  host:
    # Leer: der Rechnername des Systems. Im Container ist das die Container-ID,
    # deshalb dort ueber HOST_NAME einen sprechenden Namen setzen.
    name: ${HOST_NAME:}
    # Last, Speicher und Laufzeit sind im Kernel nicht pro Container getrennt -
    # /proc zeigt im Container also bereits die Werte des Hosts.
    proc-path: /proc
    # Das Dateisystem ist getrennt. Ohne eingehaengtes Verzeichnis des Hosts
    # meldet der Container hier seine eigene Overlay-Schicht.
    disk-path: ${HOST_DISK_PATH:/}
    interval: 15s
  transit:
    base-url: https://www3.vvs.de/vvs
    # Haltestellen-IDs des VVS. Zu finden ueber
    # https://www3.vvs.de/vvs/XML_STOPFINDER_REQUEST?outputFormat=rapidJSON&type_sf=any&name_sf=<Name>
    origin: "${TRANSIT_ORIGIN:de:08111:2420}"
    destination: "${TRANSIT_DESTINATION:de:08111:6008}"
    results: 4
    # Kurz genug, dass Verspaetungen ankommen; die Abfahrtszaehler laufen im
    # Browser ohnehin sekundenweise weiter.
    interval: 2m

logging:
  level:
    com.atrapfare.dashboard: INFO

---
spring:
  config:
    activate:
      on-profile: dev

dashboard:
  weather:
    interval: 1m
  calendar:
    interval: 1m
  news:
    interval: 1m
  vps:
    interval: 30s
  host:
    interval: 10s
  transit:
    interval: 1m

logging:
  level:
    com.atrapfare.dashboard: DEBUG
